[tools]
uv = "latest"

[tasks.lint]
description = "Lint with ruff + type-check with ty"
sources = ["src/**/*.py", "tests/**/*.py", "examples/**/*.py", "pyproject.toml", "uv.lock"]
run = ["uv run ruff check src tests examples", "uv run ty check src"]

[tasks.format]
description = "Format code with ruff"
sources = ["src/**/*.py", "tests/**/*.py", "examples/**/*.py"]
run = "uv run ruff format src tests examples"

[tasks.check-format]
description = "Check formatting without writing changes"
sources = ["src/**/*.py", "tests/**/*.py", "examples/**/*.py", "pyproject.toml"]
run = "uv run ruff format --check src tests examples"

[tasks.test]
description = "Run the test suite"
sources = ["src/**/*.py", "tests/**/*.py", "examples/**/*.py", "pyproject.toml", "uv.lock"]
run = "uv run pytest tests/"

[tasks.docs]
description = "Generate API documentation with pdoc"
sources = ["src/**/*.py", "pdoc-templates/*.jinja2", "README.md", "pyproject.toml", "uv.lock"]
# Explicit modules bypass package __all__ without importing the standalone bootstrap.
run = "uv run --extra docs pdoc --docformat google -t pdoc-templates -o docs hfdask hfdask.jobs hfdask.cluster hfdask.client hfdask.routing hfdask.config hfdask.cli hfdask.runner hfdask.hardware hfdask.network"

[tasks.build]
description = "Build wheel and source distribution"
sources = ["src/**/*.py", "tests/**/*.py", "examples/**/*", "pdoc-templates/*.jinja2", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]
run = [
    "uv build",
    "if tar -tzf dist/hfdask-*.tar.gz | grep -Eq '/(\\.cache|\\.venv|dist|docs)/'; then echo 'source distribution contains build or cache files' >&2; exit 1; fi",
]
